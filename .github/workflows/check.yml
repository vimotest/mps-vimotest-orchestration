name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches broken/changed upstream releases

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules (best effort)
        # Private submodules are not readable with the default GITHUB_TOKEN; they are
        # reported as warnings and skipped by the checks instead of failing the run.
        run: |
          for p in $(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            git submodule update --init --depth 1 -- "$p" \
              || echo "::warning::Could not fetch submodule '$p' (private repo or unpinned SHA)"
          done
      - name: Script syntax
        run: python3 -m py_compile scripts/orchestrate.py scripts/check.py
      - name: Orchestrate smoke test
        run: ./orchestrate --help > /dev/null
      - name: Consistency checks
        run: python3 scripts/check.py --remote
